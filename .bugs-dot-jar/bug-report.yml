        comment:
        - '#text': <p>Have you logged a bug on Jetty? Is fixing Jetty an option?</p>
          '@author': julianhyde
          '@created': Thu, 9 Jun 2016 15:51:16 +0000
          '@id': '15322746'
        - '#text': '<blockquote><p>Have you logged a bug on Jetty?</p></blockquote>


            <p>Not yet. Need to do some searching first to see if this was already
            addressed.</p>


            <blockquote><p>is fixing Jetty an option?</p></blockquote>


            <p>Even if we could fix Jetty, the existing API provided for downstream
            projects to configure the Avatica server doesn''t expose the allowedRoles
            option (I didn''t realize it affected things for the SPNEGO auth when
            implementing it &#8211; only wired it up for Basic and Digest auth). Either
            way, we''re going to have to add some code &#8211; the Jetty bug is just
            going to require downstream users to have to explicitly list all roles
            instead of just setting <tt>*</tt> which is more of a nuisance than a
            limitation.</p>'
          '@author': elserj
          '@created': Thu, 9 Jun 2016 15:56:31 +0000
          '@id': '15322755'
        - '#text': <p>Fixed in <a href="https://git1-us-west.apache.org/repos/asf?p=calcite.git;a=commit;h=f68ae55ca3eb9241a47d956a49a4b407ce40a565"
            class="external-link" target="_blank" rel="nofollow noopener">https://git1-us-west.apache.org/repos/asf?p=calcite.git;a=commit;h=f68ae55ca3eb9241a47d956a49a4b407ce40a565</a></p>
          '@author': elserj
          '@created': Thu, 9 Jun 2016 22:47:16 +0000
          '@id': '15323542'
        - '#text': <p>Resolved in release avatica-1.9.0 (2016/11/01).</p>
          '@author': julianhyde
