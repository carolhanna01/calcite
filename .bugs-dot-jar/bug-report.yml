      description: "<p>When setting up the Jetty security Constraint class, Jetty\
        \ treats Kerberos realms as \"roles\". When configuring allowed users to Jetty\
        \ with some constraint, you have to set what roles (realms) are allowed.</p>\n\
        \n<p>Presently, Avatica just sets the realm of the server's principal as allowed,\
        \ which means that in some multi-realm KDC (or cross-domain MIT KRB+Active\
        \ Directory) setup, users from the other realm which should be allowed are\
        \ denied.</p>\n\n<p>Even better, Jetty's syntax for <tt>&#42;</tt> for allowing\
        \ any role (realm) doesn't actually work. Their logic in 9.2.15 for <tt>ConstraintSecurityHandler</tt>\
        \ appears broken:</p>\n\n<div class=\"code panel\" style=\"border-width: 1px;\"\
        ><div class=\"codeContent panelContent\">\n<pre class=\"code-java\">     \
        \   <span class=\"code-comment\">//handle * role constraint\n</span>     \
        \   <span class=\"code-keyword\">if</span> (roleInfo.isAnyRole() &amp;&amp;\
        \ request.getUserPrincipal() != <span class=\"code-keyword\">null</span> &amp;&amp;\
        \ isUserInRole)\n        {\n            <span class=\"code-keyword\">return</span>\
        \ <span class=\"code-keyword\">true</span>;\n        }\n</pre>\n</div></div>\n\
        \n<p>The above check should let users through with any role when <tt>isAnyRole()</tt>\
        \ returns true, but the final <tt>isUserInRole</tt> check requires that the\
        \ role is explicitly listed in the list of allowedRoles.</p>\n\n<p>As such,\
        \ we're going to need to expose an API which allows users to set a list of\
        \ allowed realms since Jetty is busted to make Kerberos authentication actually\
        \ work correctly.</p>\n\n<p>Thanks to <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=kliew\"\
        \ class=\"user-hover\" rel=\"kliew\">kliew</a> for bringing this one to my\
        \ attention.</p>"
