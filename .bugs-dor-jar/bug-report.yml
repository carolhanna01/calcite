      description: "<p><a href=\"https://issues.apache.org/jira/browse/CALCITE-6413\"\
        \ title=\"SqlValidator does not invoke  TypeCoercionImpl::binaryComparisonCoercion\
        \ for both NATURAL and USING join conditions\" class=\"issue-link\" data-issue-key=\"\
        CALCITE-6413\"><del>CALCITE-6413</del></a> introduced the following code in\
        \ <tt>SqlToRelConverter#convertUsing</tt> :</p>\n\n<div class=\"code panel\"\
        \ style=\"border-width: 1px;\"><div class=\"codeContent panelContent\">\n\
        <pre class=\"code-java\">\nRelDataType resultType =\n  validator().getTypeCoercion().commonTypeForBinaryComparison(\n\
        \    comparedTypes.get(0), comparedTypes.get(1));\n<span class=\"code-keyword\"\
        >if</span> (resultType == <span class=\"code-keyword\">null</span>) {\n  <span\
        \ class=\"code-comment\">// This should never happen, since the program has\
        \ been validated.\n</span>  <span class=\"code-keyword\">throw</span> <span\
        \ class=\"code-keyword\">new</span> IllegalArgumentException(<span class=\"\
        code-quote\">\"Cannot join on field `\"</span> + name\n    + <span class=\"\
        code-quote\">\"` because the types are not comparable: \"</span> + comparedTypes);\n\
        }\n</pre>\n</div></div>\n\n<p>This can cause regressions on downstream projects\
        \ which use their own TypeCoercion, and which decide to return <tt>null</tt>\
        \ in some circumstances, e.g. to avoid forcing any coercion from Calcite planner\
        \ side, and leave the original expression as it is because they rely on a\
        \ runtime engine coercion (outside of Calcite scope).</p>\n\n<p>Notice that\
        \ the above code (to convert Join's using condition) is NOT aligned with code\
        \ for binary call expressions, as we can see here:<br/>\n<a href=\"https://github.com/apache/calcite/blob/main/core/src/main/java/org/apache/calcite/sql/validate/implicit/TypeCoercionImpl.java#L244\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://github.com/apache/calcite/blob/main/core/src/main/java/org/apache/calcite/sql/validate/implicit/TypeCoercionImpl.java#L244</a><br/>\n\
        If the commonTypeForBinaryComparison returns null, then the binary call is\
        \ left untouched (no coercion), and the process goes on, without any exception.<br/>\n\
        <tt>SqlToRelConverter#convertUsing</tt> should probably behave in the same\
        \ way to avoid any regression, i.e.:</p>\n<div class=\"code panel\" style=\"\
        border-width: 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"\
        code-java\">\nRelDataType resultType =\n  validator().getTypeCoercion().commonTypeForBinaryComparison(\n\
        \    comparedTypes.get(0), comparedTypes.get(1));\n<span class=\"code-keyword\"\
        >if</span> (resultType == <span class=\"code-keyword\">null</span>) {\n  <span\
        \ class=\"code-comment\">// keep old code, no expcetion\n</span>  list.add(rexBuilder.makeCall(SqlStdOperatorTable.EQUALS,\
        \ operands));\n} <span class=\"code-keyword\">else</span> {\n  <span class=\"\
        code-comment\">// <span class=\"code-keyword\">new</span> code from CALCITE-6413\n\
        </span>  List&lt;RexNode&gt; castedOperands = <span class=\"code-keyword\"\
        >new</span> ArrayList&lt;&gt;();\n  ...\n  list.add(rexBuilder.makeCall(SqlStdOperatorTable.EQUALS,\
        \ \n}\n</pre>\n</div></div>"
